name: GamePulse Bot - Weekly (All categories + Weekly Digest)

on:
  schedule:
    - cron: '0 21 * * 0'  # Sunday 21:00 UTC = 18:00 BRT
  workflow_dispatch:

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
      DB_PATH: data/gamepulse.db
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run Weekly Job (all categories)
        run: |
          python -m src.main weekly
      
      - name: Run Weekly Digest
        run: |
          python -m src.main digest
      
      - name: Upload database as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gamepulse-db-weekly
          path: data/gamepulse.db
          retention-days: 30