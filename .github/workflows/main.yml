name: GamePulse Bot - Main Run (Every 3 hours)

on:
  schedule:
    # Runs every 3 hours: 00:00, 03:00, 06:00, 09:00, 12:00, 15:00, 18:00, 21:00 UTC
    # Which is 21:00, 00:00, 03:00, 06:00, 09:00, 12:00, 15:00, 18:00 BRT
    - cron: '0 */3 * * *'
  workflow_dispatch:  # Manual trigger

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run GamePulse Bot
        run: |
          cd src
          python bot.py
      
      - name: Upload database as artifact (for debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gamepulse-db
          path: data/gamepulse.db
          retention-days: 7